services:
  postgres:
    image: postgres:16-alpine
    container_name: leaderboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leaderboard
      POSTGRES_PASSWORD: leaderboard
      POSTGRES_DB: leaderboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaderboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: leaderboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaderboard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      SERVER_PORT: 8080
      DATABASE_URL: postgres://leaderboard:leaderboard@postgres:5432/leaderboard?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      REDIS_USE_TLS: "false"
      JWT_SECRET: local-dev-secret-change-me
      JWT_EXPIRY_HOURS: 72
      ALLOWED_ORIGINS: http://localhost:4200
      RATE_LIMIT_BYPASS_TOKEN: local-dev-bypass-token-change-me
    ports:
      - "8080:8080"

  generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leaderboard-generator
    restart: unless-stopped
    depends_on:
      - backend
    command: ["./generator"]
    environment:
      API_BASE_URL: http://backend:8080
      GENERATOR_NUM_BOTS: 500
      GENERATOR_TICK_INTERVAL: 1s
      GENERATOR_ACTIVE_PER_TICK: 3
      GENERATOR_BOT_PASSWORD: local-dev-bot-password-change-me
      RATE_LIMIT_BYPASS_TOKEN: local-dev-bypass-token-change-me

volumes:
  postgres_data:
